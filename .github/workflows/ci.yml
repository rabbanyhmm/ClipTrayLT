name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libevdev-dev \
            libsqlite3-dev \
            libatspi2.0-dev \
            libglib2.0-dev \
            libx11-dev \
            libxcb1-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile binaries
        run: |
          cmake --build build -j$(nproc)

      - name: Run Storage & Deduplication Tests
        run: |
          ./build/test_storage

      - name: Verify CLI Functionality
        run: |
          ./build/cliptraylt --version
          ./build/cliptraylt --help
          ./build/cliptraylt config show
          ./build/cliptraylt config set max_items 50
          ./build/cliptraylt config set save_to_disk true
          ./build/cliptraylt config set ignore_password_managers true
          ./build/cliptraylt config reset
