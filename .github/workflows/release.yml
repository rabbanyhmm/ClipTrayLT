name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            libevdev-dev \
            libsqlite3-dev \
            libatspi2.0-dev \
            libglib2.0-dev \
            libx11-dev \
            libxcb1-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Release Binaries
        run: |
          cmake --build build -j$(nproc)
          strip build/cliptraylt build/cliptraylt-trigger

      - name: Run Tests
        run: |
          ./build/test_storage

      - name: Package Release Assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" == "main" || -z "${VERSION}" ]]; then
            VERSION="v1.0.0"
          fi
          bash scripts/package.sh "${{ matrix.arch }}" "${{ matrix.deb_arch }}" "${VERSION}"

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: assets-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist-all
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        run: |
          mkdir -p dist
          cp dist-all/* dist/
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${VERSION}" == "main" || -z "${VERSION}" ]]; then
            VERSION="v1.0.0"
          fi
          gh release upload "${VERSION}" dist/* --clobber
